extensions:
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: detailed
  otlp/es_apm_server:
    endpoint: es-apm-server:8200
    tls:
      insecure: true               # 开发无 TLS，必须开 insecure
service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp/es_apm_server]
    metrics:
      receivers: [otlp]
      exporters: [debug, otlp/es_apm_server]
    logs:
      receivers: [otlp]
      exporters: [debug, otlp/es_apm_server]
